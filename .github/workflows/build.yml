name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          cache-on-failure: true

      # Build frontend once (needed for embedded assets)
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Verify frontend and build/test in one step
      - name: Verify frontend and build
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html must exist for compilation"
            exit 1
          fi
          cargo build --release

      - name: Run tests
        run: cargo test --release

      # Only run linting on stable to save time
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt -- --check

      - name: Run clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

