name: Publish to Crates.io

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend build
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist)" ]; then
            echo "Error: Frontend build directory is empty or missing"
            exit 1
          fi
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html not found"
            ls -la frontend/dist/
            exit 1
          fi
          echo "Frontend build verified: frontend/dist/index.html exists"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Update version in Cargo.toml (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Verify Cargo.toml and frontend files
        run: |
          # Verify frontend files exist before running cargo check
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html must exist before compilation"
            exit 1
          fi
          cargo check --manifest-path Cargo.toml

      - name: Run tests
        run: cargo test --verbose --release

      - name: Build release
        run: cargo build --release

      - name: Prepare for publish
        run: |
          cargo package --list

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish --token $CARGO_REGISTRY_TOKEN

      - name: Create Git tag (if not exists)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release version ${VERSION}"
          git push origin "v${VERSION}"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    if: success()
    steps:
      - name: Success notification
        run: |
          echo "✅ Successfully published to crates.io"
          echo "Package: devui"
          echo "Version: $(grep '^version' Cargo.toml | cut -d '"' -f 2)"

