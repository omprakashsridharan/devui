[package]
name = "devui"
version = "0.1.0"
edition = "2021"

[dependencies]
tower = "0.4"
tower-layer = "0.3"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
http = "1.0"
http-body = "1.0"
pin-project = "1.0"
futures = "0.3"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"

[dev-dependencies]
cargo-watch = "8.5"
