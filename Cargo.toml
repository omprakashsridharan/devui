[package]
name = "devui"
version = "0.0.1"
edition = "2021"
description = "A comprehensive development tools UI library with PostgreSQL SQL management capabilities"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/devui"
homepage = "https://github.com/yourusername/devui"
documentation = "https://docs.rs/devui"
keywords = ["admin", "dev-tools", "web-ui", "axum", "react"]
categories = ["development-tools", "web-programming", "database"]
readme = "README.md"
exclude = [
  "frontend/node_modules",
  "frontend/src",
  "frontend/tsconfig*.json",
  "frontend/vite.config.ts",
  "frontend/index.html",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/eslint.config.js",
  "frontend/public",
  ".github",
  "docs",
  "examples",
  "*.md",
  "!README.md",
  "Makefile",
  "dev.sh",
  ".gitignore",
]

[dependencies]
axum = "0.8.6"
tokio = { version = "1.0", features = ["full"] }
http = "1.0"
tower-http = { version = "0.6.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0.17"
derive_builder = "0.20.2"
hex = "0.4"
rdkafka = { version = "0.38", features = ["cmake-build"] }
tokio-stream = "0.1.17"
futures-util = "0.3.31"
async-stream = "0.3.6"

[dev-dependencies]
cargo-watch = "8.5"
