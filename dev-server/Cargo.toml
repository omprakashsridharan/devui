[package]
name = "devui-dev-server"
version = "0.1.0"
edition = "2021"
description = "Local development server using devui from workspace"

[dependencies]
axum = "0.8.6"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Use devui from local workspace (for development)
devui = { path = ".." }

